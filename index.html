<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>P2P WebRTC Chat Room</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #111;
      color: #eee;
      padding: 2em;
      display: flex;
      justify-content: center;
    }
    #app {
      width: 100%;
      max-width: 600px;
    }
    h2 {
      text-align: center;
    }
    #chat {
      background: #222;
      padding: 1em;
      height: 300px;
      overflow-y: auto;
      border-radius: 5px;
      margin-bottom: 1em;
    }
    input, button {
      width: 100%;
      padding: 0.5em;
      margin-top: 0.5em;
      border-radius: 5px;
      border: none;
    }
    button {
      background: #4caf50;
      color: white;
      font-weight: bold;
    }
    #status {
      text-align: center;
      margin-top: 10px;
      font-size: 0.9em;
      color: #4caf50;
    }
  </style>
</head>
<body>
  <div id="app">
    <h2>🟢 P2P WebRTC Chat Room</h2>
    <div id="chat"></div>
    <input id="name" placeholder="Your name..." />
    <input id="msg" placeholder="Message..." />
    <button id="send">Send</button>
    <div id="status">Connecting...</div>
  </div>

  <script>
    const HOST_ID = "p2p-chat-room";
    const isHost = location.hash === "#host";
    const chat = document.getElementById("chat");
    const nameInput = document.getElementById("name");
    const msgInput = document.getElementById("msg");
    const sendBtn = document.getElementById("send");
    const status = document.getElementById("status");

    const peer = new Peer(isHost ? HOST_ID : undefined, {
      debug: 2
    });

    let connections = [];
    let conn;

    function log(msg, sender = "System") {
      chat.innerHTML += `<div><strong>${sender}:</strong> ${msg}</div>`;
      chat.scrollTop = chat.scrollHeight;
    }

    // Handle chat input
    sendBtn.onclick = () => {
      const name = nameInput.value.trim() || "Anonymous";
      const text = msgInput.value.trim();
      if (!text) return;
      const message = { name, text };
      log(text, name);
      msgInput.value = "";

      if (isHost) {
        connections.forEach(c => c.open && c.send(message));
      } else if (conn && conn.open) {
        conn.send(message);
      }
    };

    // Hosting
    peer.on("open", id => {
      if (isHost) {
        status.textContent = `Hosting as "${HOST_ID}"`;
      } else {
        conn = peer.connect(HOST_ID);
        conn.on("open", () => {
          status.textContent = `Connected to room`;
        });
        conn.on("data", data => {
          log(data.text, data.name);
        });
        conn.on("close", () => {
          status.textContent = `🔌 Disconnected from room.`;
        });
      }
    });

    // Accept clients if host
    if (isHost) {
      peer.on("connection", c => {
        connections.push(c);
        c.on("data", data => {
          log(data.text, data.name);
          // rebroadcast
          connections.forEach(other => {
            if (other !== c && other.open) {
              other.send(data);
            }
          });
        });
        c.on("close", () => {
          connections = connections.filter(x => x !== c);
        });
      });
    }

    peer.on("error", err => {
      status.textContent = "❌ Error: " + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
