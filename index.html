<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pure WebRTC Chat</title>
  <style>
    body { background: #111; color: #eee; font-family: sans-serif; padding: 2em; }
    #chat { background: #222; padding: 1em; height: 300px; overflow-y: auto; border-radius: 5px; margin-bottom: 1em; }
    input, button { padding: 0.5em; border-radius: 4px; border: none; width: 100%; margin-top: 0.5em; }
    button { background: #4caf50; color: white; font-weight: bold; cursor: pointer; }
    h2 { text-align: center; }
  </style>
</head>
<body>
  <h2>🧪 Pure WebRTC Chat (Same Browser Tabs)</h2>
  <div id="chat"></div>
  <input id="name" placeholder="Your name..." />
  <input id="msg" placeholder="Message..." />
  <button id="send">Send</button>

  <script>
    const chat = document.getElementById("chat");
    const nameInput = document.getElementById("name");
    const msgInput = document.getElementById("msg");
    const sendBtn = document.getElementById("send");

    let dc, pc;
    const channel = new BroadcastChannel("webrtc-signal");

    function log(msg, who = "System") {
      chat.innerHTML += `<div><strong>${who}:</strong> ${msg}</div>`;
      chat.scrollTop = chat.scrollHeight;
    }

    function createPeer(isCaller) {
      pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });

      if (isCaller) {
        dc = pc.createDataChannel("chat");
        setupDataChannel(dc);
      } else {
        pc.ondatachannel = e => {
          dc = e.channel;
          setupDataChannel(dc);
        };
      }

      pc.onicecandidate = e => {
        if (e.candidate) {
          channel.postMessage({ type: "candidate", candidate: e.candidate });
        }
      };

      if (isCaller) {
        pc.createOffer()
          .then(offer => pc.setLocalDescription(offer))
          .then(() => {
            channel.postMessage({ type: "offer", sdp: pc.localDescription });
          });
      }
    }

    function setupDataChannel(channel) {
      channel.onmessage = e => {
        const { name, text } = JSON.parse(e.data);
        log(text, name);
      };
    }

    sendBtn.onclick = () => {
      const name = nameInput.value || "Anonymous";
      const text = msgInput.value;
      msgInput.value = "";
      if (dc && dc.readyState === "open") {
        dc.send(JSON.stringify({ name, text }));
        log(text, name);
      } else {
        log("⚠️ Not connected");
      }
    };

    // Listen for signaling messages
    channel.onmessage = async e => {
      const data = e.data;
      if (data.type === "offer") {
        createPeer(false);
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        channel.postMessage({ type: "answer", sdp: pc.localDescription });
      } else if (data.type === "answer") {
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      } else if (data.type === "candidate") {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (e) {}
      }
    };

    // Start caller
    createPeer(true);
  </script>
</body>
</html>
