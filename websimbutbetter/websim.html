</textarea>
  <label id="imageModeLabel"><input type="checkbox" id="imageModeCheckbox" /> Generate image instead of HTML</label>

<div id="container">
  <aside id="revisions">
    <h2>Revisions</h2>
    <ul id="revisionList"></ul>
  </aside>

  <section id="mainContent">
    <div id="previewWrapper">
      <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe>
      <div id="loadingOverlay">Generating...</div>
    </div>
    <div id="errorMessage"></div>
  </section>
</div>

<script>
  const promptInput = document.getElementById('promptInput');
  const generateBtn = document.getElementById('generateBtn');
  const previewFrame = document.getElementById('previewFrame');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const errorMessage = document.getElementById('errorMessage');
  const revisionList = document.getElementById('revisionList');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const systemPromptInput = document.getElementById('systemPromptInput');
  const imageModeCheckbox = document.getElementById('imageModeCheckbox');

  let revisions = [];
  let currentContent = '';

  // Set the initial content of the system prompt textarea from its own content
  // This is a bit meta: the text is defined in the HTML, and this script reads it.
  systemPromptInput.value = systemPromptInput.textContent.trim();


  settingsBtn.addEventListener('click', () => {
    settingsPanel.style.display = settingsPanel.style.display === 'block' ? 'none' : 'block';
  });

  function addRevision(prompt, content) {
    revisions.push({prompt, content});
    renderRevisionList();
    selectRevision(revisions.length - 1);
  }

  function renderRevisionList() {
    revisionList.innerHTML = '';
    revisions.forEach((rev, idx) => {
      const li = document.createElement('li');
      li.textContent = `${idx + 1}: ${rev.prompt.length > 40 ? rev.prompt.slice(0, 37) + '...' : rev.prompt}`;
      li.dataset.index = idx;
      if(idx === revisions.length - 1) li.classList.add('active');
      li.onclick = () => selectRevision(idx);
      revisionList.appendChild(li);
    });
  }

  function selectRevision(index) {
    if(index < 0 || index >= revisions.length) return;
    revisions.forEach((_, i) => {
      revisionList.children[i].classList.toggle('active', i === index);
    });
    const rev = revisions[index];
    previewFrame.srcdoc = rev.content;
    currentContent = rev.content;
    
    // When selecting a revision, update the system prompt to contain the code of that revision
    const newSystemPrompt = `You are an expert web developer AI. Your primary task is to modify the HTML code provided below based on the user's request.

**Key Instructions:**
1.  **Analyze the Request:** Carefully read the user's prompt to understand the desired changes.
2.  **Modify the Code:** Apply the changes directly to the HTML code provided within this prompt.
3.  **Return Full Code:** ALWAYS return the complete, single-file HTML. This includes all original code plus the new modifications.
4.  **Raw HTML Output:** Provide ONLY the raw HTML code. **DO NOT** wrap the code in markdown blocks (e.g., \`\`\`html).

--- BEGIN CODE TO MODIFY ---
${rev.content}`;
    systemPromptInput.value = newSystemPrompt;
  }

  async function generate() {
    const userPrompt = promptInput.value.trim();
    if(!userPrompt) {
      alert('Please enter a prompt!');
      return;
    }
    errorMessage.style.display = 'none';
    loadingOverlay.style.display = 'block';
    previewFrame.srcdoc = '';

    const systemPrompt = encodeURIComponent(systemPromptInput.value.trim());
    const useImageMode = imageModeCheckbox.checked;

    if(useImageMode) {
      // Image generation mode
      try {
        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(userPrompt)}`;
        previewFrame.srcdoc = `<html><body style="margin:0;display:flex;justify-content:center;align-items:center;background:#f0f3ff;"><img src="${imageUrl}" alt="Generated image" style="max-width:100%;max-height:100vh;object-fit:contain;" /></body></html>`;
        addRevision(userPrompt, previewFrame.srcdoc);
      } catch(e) {
        errorMessage.textContent = 'Error generating image: ' + e.message;
        errorMessage.style.display = 'block';
      } finally {
        loadingOverlay.style.display = 'none';
      }
      return;
    }

    // HTML generation
    try {
      const encodedPrompt = encodeURIComponent(userPrompt);
      const url = `https://text.pollinations.ai/${encodedPrompt}?system=${systemPrompt}`;

      const response = await fetch(url);
      if(!response.ok) throw new Error(`HTTP error ${response.status}`);

      const textResult = await response.text();

      if(!textResult || !textResult.includes('<html')) {
          throw new Error('AI response does not appear to be valid HTML.');
      }
      
      addRevision(userPrompt, textResult);

    } catch(err) {
      errorMessage.textContent = 'Error generating website: ' + err.message;
      errorMessage.style.display = 'block';
    } finally {
      loadingOverlay.style.display = 'none';
    }
  }

  generateBtn.addEventListener('click', generate);
  promptInput.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      generate();
    }
  });

  // Initialize with the current page's own source code as the first revision
  const initialContent = document.documentElement.outerHTML;
  addRevision('Initial state', initialContent);

</script>
